name: CI

on:
  # main only. Triggering on every branch as well as on pull_request ran the whole
  # workflow twice for every PR — same commit, double the minutes — and put a
  # permanently "skipped" instrumented job on each PR, which reads like a broken gate.
  # A feature branch is covered the moment it has a PR; before that, use the Run
  # workflow button (workflow_dispatch) if you want a check.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run still in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle cache (dependencies + build cache) automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fail fast on formatting before the expensive build/test steps.
      # Fix locally with `./gradlew spotlessApply`.
      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lint

      # if: always() so reports still upload when a step above failed —
      # that is exactly when you want to read them.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Slow (~10-15 min), and deliberately unconditional now: the trigger list above is
    # what keeps it off feature-branch pushes. It used to carry an `if:` naming
    # pull_request and main, which every surviving trigger already satisfies — a
    # condition that is always true is worse than no condition, because it looks like
    # a gate. Restore it if `push` ever widens past main again.
    strategy:
      # Every level reports. Stopping the matrix at the first red would hide whether a
      # failure is "this build is broken" or "this build is broken *below API 31*",
      # which is the entire question the bottom of the matrix exists to answer.
      fail-fast: false
      matrix:
        include:
          # The `minSdk` floor. Three SDK_INT branches — the pre-S path into system
          # backup settings, the pre-R agent branch and the pre-S theme — plus
          # AppCompat's pre-13 locale backport (ADR-0013) run *only* down here, and a
          # single modern emulator never executes any of them. `default` rather than
          # `aosp_atd`: the slim ATD images start at API 30, so 26 has no such image.
          - api-level: 26
            target: default
          # The long-standing leg, kept as-is.
          - api-level: 34
            target: aosp_atd
          # `targetSdk`. Where the platform applies its newest behaviour changes to us
          # rather than grandfathering them.
          - api-level: 36
            target: aosp_atd
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The hosted runner supports nested virtualisation, so the emulator is
      # hardware-accelerated. Without KVM this job would take hours.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # The name has to carry the API level: upload-artifact refuses to write the same
      # artifact name twice, so a shared name fails every leg after the first.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14
